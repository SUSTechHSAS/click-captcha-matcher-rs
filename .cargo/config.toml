# Size trims for Linux: panics abort, so unwind tables are dead weight, and no
# build-id note is needed. (Other targets keep their defaults; macOS and
# Windows x64 require unwind tables.)
[target.'cfg(target_os = "linux")']
rustflags = ["-C", "force-unwind-tables=no", "-C", "link-arg=-Wl,--build-id=none"]

# Let programs linking libccm.dylib find it via their rpath, not the build path.
[target.'cfg(target_os = "macos")']
rustflags = ["-C", "link-arg=-Wl,-install_name,@rpath/libccm.dylib"]
